name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install runtime and validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl python3-venv shellcheck zstd
          python3 -m venv "$RUNNER_TEMP/parquet-reader"
          "$RUNNER_TEMP/parquet-reader/bin/pip" install --disable-pip-version-check duckdb==1.3.2

      - name: Run full CI gate
        env:
          PARQUET_PYTHON: ${{ runner.temp }}/parquet-reader/bin/python
        run: bash scripts/ci.sh

      - name: Scan full history for leaked credentials
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/betterleaks/betterleaks@sha256:7a43a20d40be02a9c13801a6485f7bea9d9cdba512263440eae972103c5291f1 \
            git /repo -v --config /repo/.betterleaks.toml

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-musl
            platform: linux-x86_64
            run-native: true
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
            platform: linux-aarch64
            run-native: true
          - runner: macos-15-intel
            target: x86_64-macos
            platform: macos-x86_64
            run-native: true
          - runner: macos-15
            target: aarch64-macos
            platform: macos-aarch64
            run-native: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Check tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(perl -ne 'print $1 if /\.version\s*=\s*"([^"]+)"/' build.zig.zon)"
          test "$RELEASE_TAG" = "v$version"

      - name: Build baseline-CPU archive
        run: bash scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.platform }}"

      - name: Validate packaged artifact
        run: bash tests/release_artifact.sh release/*.tar.gz "${{ matrix.run-native }}"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          artifact-name: fable-monitor-${{ github.ref_name }}.spdx.json
          output-file: release/fable-monitor-${{ github.ref_name }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        working-directory: release
        run: sha256sum -- ./*.tar.gz ./*.spdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*.tar.gz

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless-sign release files
        working-directory: release
        run: |
          set -euo pipefail
          for file in ./*.tar.gz ./*.spdx.json ./SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
